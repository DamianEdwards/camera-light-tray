name: Verify
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark mode
        required: true
        type: choice
        options: [baseline, multithreaded]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Record environment
        shell: pwsh
        run: |
          dotnet --info
          Write-Host "PROCESSOR_COUNT=$env:NUMBER_OF_PROCESSORS"
          Write-Host "RUNNER_IMAGE=$env:ImageOS $env:ImageVersion"
      - name: Build solution
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          if ($env:MODE -eq 'multithreaded') {
            dotnet build CameraLightTray.slnx -c Release --nologo -v:q -mt
          } else {
            dotnet build CameraLightTray.slnx -c Release --nologo -v:q
          }
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Write-Host "BENCHMARK_MODE=$env:MODE ELAPSED_SECONDS=$($timer.Elapsed.TotalSeconds)"
          if ($exitCode -ne 0) { throw "Build failed: $exitCode" }
      - name: Check outputs and run synthetic tests
        shell: pwsh
        run: |
          $outputs = @(Get-ChildItem artifacts/bin -Recurse -File | Where-Object {
            $_.Extension -in @('.dll', '.exe', '.pri', '.xbf', '.json')
          } | ForEach-Object { $_.FullName.Substring((Get-Location).Path.Length + 1) } | Sort-Object)
          if (-not $outputs.Count) { throw 'No build outputs found.' }
          $outputs | ForEach-Object { Write-Host "OUTPUT=$_" }
          dotnet run --project tests\CameraLightTray.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic tests failed.' }
